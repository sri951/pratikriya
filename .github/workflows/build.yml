name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test · Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ai@7 requires Node >= 22 (EBADENGINE on 20.x).
        node-version: ["22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm install` (not `npm ci`) because package-lock.json currently drifts
      # from package.json. `npm install` reconciles inside the runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          HUSKY: "0"

      # `npm run lint` is intentionally NOT run in CI right now: the codebase
      # has ~1000 pre-existing Prettier formatting mismatches. Run
      # `npm run format && npm run lint -- --fix` locally to clean them up,
      # then re-enable this step.

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build
